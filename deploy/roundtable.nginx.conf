limit_req_zone $binary_remote_addr zone=kanshan_api:1m rate=6r/m;
limit_req_zone $server_name zone=kanshan_total:1m rate=60r/m;
limit_conn_zone $server_name zone=kanshan_connections:1m;

server {
    listen 80;
    server_name roundtable.xiaoshixuji.xyz;
    location /.well-known/acme-challenge/ { root /var/www/kanshan-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name roundtable.xiaoshixuji.xyz;
    ssl_certificate /etc/letsencrypt/live/roundtable.xiaoshixuji.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roundtable.xiaoshixuji.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 8k;

    # Serve only public image assets directly, independently of the Node process.
    location ~ ^/public/assets/[\w-]+\.(png|gif)$ {
        root /opt/kanshan/current;
        try_files $uri =404;
        expires 1h;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location /api/ {
        limit_req zone=kanshan_api burst=6 nodelay;
        limit_req zone=kanshan_total burst=10 nodelay;
        limit_conn kanshan_connections 4;
        limit_req_status 429;
        limit_conn_status 429;
        access_log off;
        proxy_pass http://127.0.0.1:4173;
        proxy_read_timeout 110s;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
    }
}
